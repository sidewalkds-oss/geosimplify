[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geosimplify"
version = "0.1.0"
description = "Topology-aware line simplification for web maps, with a benchmark on Natural Earth data"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Kaisi Omar" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "shapely>=2.0"]
keywords = ["cartography", "line simplification", "vector tiles", "topology", "GIS", "web mapping"]

[project.optional-dependencies]
dev = ["pytest>=7", "pandas>=2.0", "matplotlib>=3.7"]

[project.urls]
Repository = "https://github.com/sidewalkds-oss/geosimplify"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
